<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>השגרה שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090a;
  --s1:#111214;
  --s2:#1a1c1f;
  --s3:#232629;
  --b1:rgba(255,255,255,0.06);
  --b2:rgba(255,255,255,0.11);
  --b3:rgba(255,255,255,0.18);
  --tx:#eef0f3;
  --mu:#555b63;
  --mu2:#8a919a;
  --gr:#22c55e;--gr2:rgba(34,197,94,0.12);--gr3:rgba(34,197,94,0.06);
  --am:#f59e0b;--am2:rgba(245,158,11,0.12);
  --rd:#ef4444;--rd2:rgba(239,68,68,0.1);
  --bl:#3b82f6;--bl2:rgba(59,130,246,0.12);
  --pu:#a855f7;--pu2:rgba(168,85,247,0.12);
  --tl:#14b8a6;--tl2:rgba(20,184,166,0.12);
  --or:#f97316;--or2:rgba(249,115,22,0.12);
  --r:16px;--rs:10px;--rx:6px;
  --shadow:0 1px 3px rgba(0,0,0,0.4),0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg:0 4px 20px rgba(0,0,0,0.5),0 1px 4px rgba(0,0,0,0.3);
}
body{background:var(--bg);color:var(--tx);font-family:'Heebo',sans-serif;min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}

/* TOPBAR */
.topbar{background:rgba(17,18,20,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--b1);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#eef0f3,#8a919a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-right{display:flex;align-items:center;gap:10px}
.streak{display:none;align-items:center;gap:5px;background:var(--am2);border:1px solid rgba(245,158,11,0.25);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--am)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--mu);transition:background 0.3s}
.sync-dot.synced{background:var(--gr)}
.sync-dot.syncing{background:var(--am);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* NAV */
.nav{display:flex;background:var(--s1);border-bottom:1px solid var(--b1);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:12px 16px;font-size:12px;font-weight:600;color:var(--mu);border:none;background:none;font-family:'Heebo',sans-serif;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;letter-spacing:0.2px;transition:color 0.2s}
.nav-btn.on{color:var(--tx);border-bottom-color:var(--tx)}

/* PAGES */
.pg{display:none;padding:16px 18px;animation:fadeIn 0.2s ease}
.pg.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color 0.2s}
.card-pad{padding:16px}
.card + .card,.card + div,.div + .card{margin-top:10px}

/* WEEK NAV */
.wknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wkbtn{background:var(--s2);border:1px solid var(--b2);color:var(--mu2);padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;font-family:'Heebo',sans-serif;transition:all 0.15s}
.wkbtn:hover{border-color:var(--b3);color:var(--tx)}
.wkbtn:disabled{opacity:0.3;cursor:default}
.wklbl{font-size:13px;font-weight:600;color:var(--mu2)}

/* DAY SCROLL */
.days{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{flex-shrink:0;padding:8px 13px;border-radius:22px;border:1px solid var(--b1);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:12px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;transition:all 0.15s}
.daybtn.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}
.daybtn .dp{font-size:10px;font-weight:600}

/* SCORE CARD */
.scorecard{padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.scorecard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent,#22c55e),transparent);opacity:0.6}
.scoretop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.scorebig{font-size:48px;font-weight:300;letter-spacing:-3px;line-height:1}
.scoreright{text-align:left}
.scoreday{font-size:11px;color:var(--mu);margin-bottom:3px;font-weight:500;letter-spacing:0.3px;text-transform:uppercase}
.scoremsg{font-size:13px;color:var(--mu2);font-weight:500}
.progbar{height:2px;background:var(--s3);border-radius:2px;overflow:hidden}
.progfill{height:100%;border-radius:2px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1)}

/* SUBTABS */
.subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:7px 15px;border-radius:22px;border:1px solid var(--b1);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.stab.on{background:var(--s2);color:var(--tx);border-color:var(--b2)}

/* TASKS */
.tasks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tsk{padding:13px 15px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:all 0.15s;margin-bottom:0}
.tsk:active{transform:scale(0.98)}
.tsk.done{background:var(--gr3);border-color:rgba(34,197,94,0.2)}
.tsk.future{opacity:0.45;cursor:default}
.tsk.tcard{cursor:default;flex-direction:column;align-items:stretch;gap:10px}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--b3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all 0.2s}
.tsk.done .chk{background:var(--gr);border-color:var(--gr);color:#000}
.tbody{flex:1}
.tname{font-size:13px;font-weight:600;margin-bottom:1px;letter-spacing:-0.1px}
.tsk.done .tname{color:var(--gr)}
.tmeta{font-size:11px;color:var(--mu2);font-weight:400}
.tw{font-size:11px;font-weight:600;color:var(--mu);min-width:26px;text-align:left}
.tcardhead{display:flex;align-items:center;gap:11px}
.tcardinputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tlbl{font-size:10px;color:var(--mu2);margin-bottom:5px;display:block;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.tfield{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:10px 11px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:14px;font-weight:500;outline:none;width:100%;text-align:center;transition:border-color 0.15s}
.tfield:focus{border-color:var(--b3)}
.tchip{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;display:inline-block;margin-top:5px}

/* WATER */
.watercard{padding:15px;margin-bottom:10px}
.waterhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.watertitle{font-size:13px;font-weight:600}
.waterval{font-size:13px;color:var(--bl);font-weight:700}
.waterbts{display:flex;gap:6px;margin-bottom:10px}
.waterbtn{flex:1;padding:9px 4px;border-radius:var(--rs);border:1px solid var(--b2);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center}
.waterbtn.add{border-color:rgba(59,130,246,0.3);color:var(--bl);background:var(--bl2)}
.waterbar{height:4px;background:var(--s3);border-radius:2px;overflow:hidden}
.waterfill{height:100%;background:var(--bl);border-radius:2px;transition:width 0.4s}

/* MOOD */
.moodcard{padding:15px;margin-bottom:10px}
.moodrow{display:flex;gap:6px}
.moodbtn{flex:1;padding:10px 2px;border-radius:var(--rs);border:1px solid var(--b1);background:transparent;cursor:pointer;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all 0.15s}
.moodbtn span{font-size:9px;color:var(--mu2);font-weight:500}
.moodbtn.on{border-color:var(--am);background:var(--am2)}

/* WEEK BARS */
.wksum{padding:15px;margin-bottom:10px}
.wksum-t{font-size:11px;color:var(--mu2);margin-bottom:12px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase}
.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.wkcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.wkname{font-size:9px;color:var(--mu);font-weight:500}
.wkbg{width:100%;height:46px;background:var(--s2);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.wkfill{width:100%;border-radius:4px;transition:height 0.4s}
.wkpct{font-size:9px;font-weight:600}
.wkavgrow{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--b1)}
.wkavglbl{font-size:12px;color:var(--mu2);font-weight:500}
.wkavgval{font-size:18px;font-weight:700}

/* AI */
.aibtn{width:100%;padding:13px;background:var(--bl2);border:1px solid rgba(59,130,246,0.2);border-radius:var(--r);color:var(--bl);font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;transition:all 0.15s;letter-spacing:-0.1px}
.aibtn:disabled{opacity:0.5}
.aibox{border-radius:var(--r);padding:16px;margin-bottom:12px;font-size:13px;line-height:1.8;color:var(--mu2);display:none;border:1px solid rgba(59,130,246,0.15);background:var(--s1)}
.aihead{font-size:11px;color:var(--bl);font-weight:700;margin-bottom:8px;letter-spacing:0.3px;text-transform:uppercase}

/* NOTES (inline daily) */
.noteinrow{display:flex;gap:7px;margin-bottom:10px}
.notein{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:10px 13px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;outline:none;font-weight:400}
.notein::placeholder{color:var(--mu)}
.noteadd{background:var(--tx);color:var(--bg);border:none;border-radius:var(--rs);padding:10px 15px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.notesel{background:var(--s2);border:1px solid var(--b2);color:var(--tx);font-family:'Heebo',sans-serif;font-size:12px;font-weight:500;padding:10px 9px;border-radius:var(--rs);outline:none}
.cattabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cattab{padding:5px 12px;border-radius:20px;border:1px solid var(--b1);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s}
.cattab.on{border-color:var(--b2);color:var(--tx);background:var(--s2)}
.notelist{display:flex;flex-direction:column;gap:6px}
.noteitem{padding:11px 13px;display:flex;align-items:flex-start;gap:10px;transition:all 0.15s}
.noteitem.todo.chkd{background:var(--gr3);border-color:rgba(34,197,94,0.2)}
.noteitem.chkd .notetx{text-decoration:line-through;color:var(--mu)}
.notechk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--b3);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:700;margin-top:2px;transition:all 0.2s}
.noteitem.chkd .notechk{background:var(--gr);border-color:var(--gr);color:#000}
.notebody{flex:1}
.notetx{font-size:13px;line-height:1.4;word-break:break-word;font-weight:400}
.notecatlbl{font-size:10px;color:var(--mu2);margin-bottom:2px;font-weight:600}
.notedel{color:var(--mu);font-size:18px;cursor:pointer;padding:0 3px;line-height:1;transition:color 0.15s}
.notedel:hover{color:var(--rd)}
.empty{font-size:12px;color:var(--mu);text-align:center;padding:22px 0;font-weight:500}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dash-card{padding:16px;position:relative;overflow:hidden}
.dash-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;opacity:0.4}
.dash-icon{font-size:22px;margin-bottom:8px}
.dash-label{font-size:10px;color:var(--mu2);font-weight:600;letter-spacing:0.3px;text-transform:uppercase;margin-bottom:4px}
.dash-val{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1}
.dash-sub{font-size:11px;color:var(--mu2);margin-top:3px;font-weight:400}
.dash-full{padding:16px;margin-bottom:10px}
.dash-full-title{font-size:11px;font-weight:700;color:var(--mu2);letter-spacing:0.3px;text-transform:uppercase;margin-bottom:12px}

/* FINANCES */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.fin-box{padding:14px;text-align:center}
.fin-box-lbl{font-size:10px;color:var(--mu2);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px}
.fin-box-val{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.fin-tabs{display:flex;gap:6px;margin-bottom:12px}
.fin-tab{flex:1;padding:8px;border-radius:var(--rs);border:1px solid var(--b1);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.15s}
.fin-tab.on{background:var(--s2);color:var(--tx);border-color:var(--b2)}
.fin-add-form{padding:14px;margin-bottom:10px}
.fin-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fin-input{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:10px 12px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;font-weight:500;outline:none;transition:border-color 0.15s}
.fin-input:focus{border-color:var(--b3)}
.fin-input::placeholder{color:var(--mu)}
.fin-label{font-size:10px;color:var(--mu2);font-weight:600;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.3px}
.fin-submit{width:100%;padding:12px;border:none;border-radius:var(--rs);font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s}
.fin-submit.income{background:var(--gr);color:#000}
.fin-submit.expense{background:var(--rd);color:#fff}
.fin-list{display:flex;flex-direction:column;gap:6px}
.fin-item{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:default}
.fin-item-icon{font-size:16px;flex-shrink:0}
.fin-item-body{flex:1}
.fin-item-name{font-size:13px;font-weight:600;margin-bottom:1px}
.fin-item-meta{font-size:11px;color:var(--mu2);font-weight:400}
.fin-item-amt{font-size:14px;font-weight:700}
.fin-item-del{color:var(--mu);font-size:16px;cursor:pointer;padding:0 3px}
.fin-month-title{font-size:12px;font-weight:700;color:var(--mu2);margin:14px 0 8px;letter-spacing:0.3px;text-transform:uppercase}
.fin-bar-wrap{margin-bottom:10px}
.fin-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--mu2);margin-bottom:4px;font-weight:500}
.fin-bar-bg{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.fin-bar-fill{height:100%;border-radius:3px;transition:width 0.5s}
.preset-badge{font-size:10px;color:var(--mu2);background:var(--s3);padding:2px 7px;border-radius:10px;font-weight:500}

/* GENERAL LISTS */
.list-tabs{display:flex;gap:6px;margin-bottom:14px}
.list-tab{flex:1;padding:9px;border-radius:var(--rs);border:1px solid var(--b1);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.15s}
.list-tab.on{background:var(--s2);color:var(--tx);border-color:var(--b2)}
.list-add-row{display:flex;gap:7px;margin-bottom:12px}
.list-input{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:11px 13px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;font-weight:400;outline:none}
.list-input::placeholder{color:var(--mu)}
.list-add-btn{background:var(--tx);color:var(--bg);border:none;border-radius:var(--rs);padding:11px 16px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.list-item{padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:0}
.list-item.done-item{background:var(--gr3);border-color:rgba(34,197,94,0.15)}
.list-item.done-item .list-item-text{text-decoration:line-through;color:var(--mu)}
.list-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--b3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s}
.list-item.done-item .list-chk{background:var(--gr);border-color:var(--gr);color:#000}
.list-item-text{flex:1;font-size:13px;font-weight:400;line-height:1.4}
.list-item-del{color:var(--mu);font-size:16px;cursor:pointer;padding:0 3px}
.list-priority{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;margin-right:4px}
.pri-high{background:var(--rd2);color:var(--rd)}
.pri-med{background:var(--am2);color:var(--am)}
.pri-low{background:var(--gr2);color:var(--gr)}

/* JOURNAL */
.jnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.jnavbtn{background:var(--s2);border:1px solid var(--b2);color:var(--mu2);padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;font-family:'Heebo',sans-serif;transition:all 0.15s}
.jnavbtn:disabled{opacity:0.3}
.jdatelbl{font-size:15px;font-weight:700;letter-spacing:-0.3px}
.jsec{padding:14px;margin-bottom:8px}
.jsectitle{font-size:10px;font-weight:700;color:var(--mu2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px}
.jta{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:11px 13px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:13px;outline:none;resize:none;line-height:1.6;min-height:72px;transition:border-color 0.15s;font-weight:400}
.jta:focus{border-color:var(--b3)}
.jta::placeholder{color:var(--mu)}
.jnumrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.jnumin{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:9px 11px;color:var(--tx);font-family:'Heebo',sans-serif;font-size:17px;font-weight:700;outline:none;width:70px;text-align:center;transition:border-color 0.15s}
.jnumlbl{font-size:12px;color:var(--mu2);font-weight:500}
.jcntbtn{background:var(--s2);border:1px solid var(--b2);color:var(--tx);width:34px;height:34px;border-radius:var(--rs);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Heebo',sans-serif;flex-shrink:0;transition:all 0.15s}
.jchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jchip{padding:5px 13px;border-radius:20px;border:1px solid var(--b2);background:transparent;color:var(--mu2);font-family:'Heebo',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s}
.jchip.on{border-color:var(--tl);background:var(--tl2);color:var(--tl)}
.jsavebtn{width:100%;padding:14px;background:var(--gr);color:#000;border:none;border-radius:var(--r);font-family:'Heebo',sans-serif;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:10px;letter-spacing:-0.2px;transition:all 0.15s}
.jsavebtn:active{transform:scale(0.98)}

function setSync(s){var d=document.getElementById('sync-dot');if(!d)return;d.className='sync-dot'+(s==='ok'?' synced':s==='ing'?' syncing':'');}
function getUserDoc(){
  if(!DB||!currentUser)return null;
  return DB.collection('users').doc(currentUser.uid);
}
function pushDB(){
  var doc=getUserDoc();
  if(!doc){setSync('off');return;}
  setSync('ing');
  doc.set({data:JSON.stringify(data),ts:Date.now(),email:currentUser.email})
    .then(function(){setSync('ok');}).catch(function(){setSync('off');});
}
function pullDB(){
  var doc=getUserDoc();
  if(!doc){setSync('off');return;}
  setSync('ing');
  doc.get()
    .then(function(d){
      if(d.exists){
        var cloud=JSON.parse(d.data().data||'{}');
        data=Object.assign({},data,cloud);
        try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
        render();renderDash();
      } else {pushDB();}
      setSync('ok');
    }).catch(function(){setSync('off');});
}

function getSched(dn){var base=JSON.parse(JSON.stringify(DSCHED[dn]));var u=(data.schedule||{})[dn];if(u)Object.assign(base,u);return base;}

// SCORING
function t2m(t){if(!t||t.indexOf(':')<0)return null;var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
function scoreWake(a,tgt){if(!a)return 0;var am=t2m(a),tm=t2m(tgt);if(am===null||tm===null)return 0;var d=am-tm;if(d<=0)return 100;if(d<=15)return 90;if(d<=30)return 75;if(d<=60)return 55;if(d<=90)return 35;return 10;}
function scoreSleep(a,tgt){if(!a)return 0;var am=t2m(a),tm=t2m(tgt);if(am===null||tm===null)return 0;if(tm<360)tm+=1440;if(am<360)am+=1440;var d=am-tm;if(d<=0)return 100;if(d<=15)return 90;if(d<=30)return 75;if(d<=60)return 50;if(d<=90)return 30;return 10;}
function dkey(d){return d.toISOString().slice(0,10);}
function getSun(d){var s=new Date(d);s.setDate(d.getDate()-d.getDay());s.setHours(0,0,0,0);return s;}
function dname(d){return DAYS[d.getDay()];}
function dd(d){var k=dkey(d);if(!data[k])data[k]={};return data[k];}
function score(d){var e=dd(d),dn=dname(d),sc=getSched(dn),tasks=sc.tasks||[];var tt=0,td=0;tasks.forEach(function(t){tt+=t.w;if(e[t.id])td+=t.w;});var ws=scoreWake(e.wake_actual,sc.wake),ss=scoreSleep(e.sleep_actual,sc.sleep),wt=Math.min(100,Math.round(((e.water_liters||0)/3)*100));return Math.round((tt>0?(td/tt)*35:0)+ws*0.25+ss*0.25+wt*0.15);}
function hasAny(d){return Object.keys(dd(d)).length>0;}
function col(p){return p>=80?'#22c55e':p>=50?'#f59e0b':'#ef4444';}
function msg(p){if(p===100)return'יום מושלם! 🔥';if(p>=80)return'מעולה, המשך כך';if(p>=50)return'חצי הדרך, אל תעצור';if(p>=20)return'התחלה טובה';return'סמן משימות שביצעת';}
function streak(){var s=0,d=new Date(TODAY);while(true){if(!hasAny(d))break;if(score(d)<70)break;s++;d.setDate(d.getDate()-1);}return s;}

var MONTHLY_FIXED=[
  {name:'נסיעות בריכה',amount:315,cat:'נסיעות'}
];

function getMonthDays(year,month){
  // Returns count of each weekday in a month
  var counts=new Array(7).fill(0);
  var d=new Date(year,month,1);
  while(d.getMonth()===month){counts[d.getDay()]++;d.setDate(d.getDate()+1);}
  return counts;
}

function calcMonthPreset(year,month){
  var counts=getMonthDays(year,month);
  // DAYS: 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
  // ראשון=0,שני=1,שלישי=2,רביעי=3,חמישי=4,שישי=5,שבת=6
  var dayMap={0:'ראשון',1:'שני',2:'שלישי',3:'רביעי',4:'חמישי',5:'שישי',6:'שבת'};
  var items=[];
  for(var i=0;i<7;i++){
    var dn=dayMap[i];
    var presets=PRESET_DAY_INCOME[dn]||[];
    presets.forEach(function(p){
      items.push({name:p.name+' (×'+counts[i]+')',amount:p.amount*counts[i],cat:p.cat,count:counts[i],perDay:p.amount,dayName:dn,jsDay:i});
    });
  }
  MONTHLY_FIXED.forEach(function(f){items.push({name:f.name,amount:f.amount,cat:f.cat,fixed:true,dayName:null});});
  return items;
}

function getFinanceKey(year,month){return'fin_'+year+'_'+month;}
function getMonthFinanceData(year,month){
  var k=getFinanceKey(year,month);
  if(!data[k])data[k]={overrides:{},extras:[],expenses:[]};
  return data[k];
}

function getMonthTotals(year,month){
  var preset=calcMonthPreset(year,month);
  var fd=getMonthFinanceData(year,month);
  var income=0;
  preset.forEach(function(p,i){
    var key='preset_'+i;
    if(fd.removedDays&&fd.removedDays[key])return; // fully removed
    var baseAmt=fd.overrides[key]!==undefined?fd.overrides[key]:p.amount;
    // count occurrences of this day in month
    var counts2=getMonthDays(year,month);
    var dayIdx=p.jsDay!==undefined?p.jsDay:['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'].indexOf(p.dayName);
    var totalOccurrences=dayIdx>=0?counts2[dayIdx]:1;
    if(totalOccurrences<1)totalOccurrences=1;
    var perOccurrence=totalOccurrences>0?p.amount/totalOccurrences:p.amount;
    // subtract specific removed dates
    var removedDates=(fd.removedDates&&fd.removedDates[key])||[];
    var deduction=removedDates.length*perOccurrence;
    var amt=Math.max(0,baseAmt-deduction);
    income+=amt;
  });
  (fd.extras||[]).forEach(function(e){if(e.type==='income')income+=e.amount;});
  // Add income from schedule events with price
  // Only count user-added events (id starts with 'ev_'), not default ones
  var schedEvents=data.wg_events||[];
  var monthDayCounts=getMonthDays(year,month);
  var dayIdx={ראשון:0,שני:1,שלישי:2,רביעי:3,חמישי:4,שישי:5,שבת:6};
  schedEvents.forEach(function(ev){
    if(!ev.price||ev.price<=0)return;
    // Only count user-added events (not default seeded ones)
    if(!ev.id||ev.id.indexOf('ev_')!==0)return;
    if(ev.repeat==='weekly'){
      var maxCount=0;
      (ev.days||[]).forEach(function(day){
        var di=dayIdx[day];
        if(di!==undefined)maxCount+=monthDayCounts[di];
      });
      income+=ev.price*maxCount;
    } else if(ev.repeat==='once'){
      income+=ev.price;
    }
  });
  // gym sales bonus
  var sales=(fd.gymSales||0);
  income+=sales*15;
  var expense=0;
  (fd.expenses||[]).forEach(function(e){expense+=e.amount;});
  (fd.extras||[]).forEach(function(e){if(e.type==='expense')expense+=e.amount;});
  return{income:income,expense:expense,balance:income-expense,gymSales:sales};
}

function finNav(dir){
  finMonth+=dir;
  if(finMonth<0){finMonth=11;finYear--;}
  if(finMonth>11){finMonth=0;finYear++;}
  renderFinance();
}

function saveFinPreset(key,val){
  var fd=getMonthFinanceData(finYear,finMonth);
  fd.overrides[key]=parseFloat(val)||0;
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();
}
function adjFinPreset(key,orig,delta){
  var inp=document.getElementById('fin-preset-'+key);
  if(!inp)return;
  var cur=parseFloat(inp.value)||orig;
  inp.value=Math.max(0,cur+delta);
  saveFinPreset(key,inp.value);
  renderFinance();
}
function resetFinPreset(key){
  var fd=getMonthFinanceData(finYear,finMonth);
  delete fd.overrides[key];
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();renderFinance();
}
function addFinExtra(){
  var desc=document.getElementById('fin-extra-desc').value.trim();
  var amt=parseFloat(document.getElementById('fin-extra-amt').value);
  if(!desc||!amt)return;
  var fd=getMonthFinanceData(finYear,finMonth);
  if(!fd.extras)fd.extras=[];
  fd.extras.push({id:Date.now()+'',type:'income',desc:desc,amount:amt});
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();renderFinance();
}
function deleteFinExtra(id){
  var fd=getMonthFinanceData(finYear,finMonth);
  fd.extras=(fd.extras||[]).filter(function(e){return e.id!==id;});
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();renderFinance();
}
function addExpense(){
  var desc=document.getElementById('exp-desc').value.trim();
  var amt=parseFloat(document.getElementById('exp-amt').value);
  var cat=document.getElementById('exp-cat').value;
  if(!desc||!amt)return;
  var fd=getMonthFinanceData(finYear,finMonth);
  if(!fd.expenses)fd.expenses=[];
  fd.expenses.push({id:Date.now()+'',desc:desc,amount:amt,cat:cat,date:dkey(TODAY)});
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();renderFinance();
}
function deleteExpense(id){
  var fd=getMonthFinanceData(finYear,finMonth);
  fd.expenses=(fd.expenses||[]).filter(function(e){return e.id!==id;});
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();renderFinance();
}
function addTodayPreset(idx){
  var dn=dname(TODAY),p=PRESET_DAY_INCOME[dn][idx];if(!p)return;
  var fd=getMonthFinanceData(finYear,finMonth);
  if(!fd.extras)fd.extras=[];
  fd.extras.push({id:Date.now()+'',type:'income',desc:p.name+' ('+dn+')',amount:p.amount,cat:p.cat});
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();renderFinance();renderDash();
}


// GENERAL LISTS
function renderLists(){
  var wrap=document.getElementById('lists-content');if(!wrap)return;
  wrap.innerHTML='';
  var tabs=document.createElement('div');tabs.className='list-tabs';
  [{id:'shopping',l:'🛒 קניות'},{id:'tasks',l:'✅ משימות חשובות'}].forEach(function(t){
    var btn=document.createElement('button');btn.className='list-tab'+(curListTab===t.id?' on':'');btn.textContent=t.l;
    btn.onclick=(function(t){return function(){curListTab=t;renderLists();};})(t.id);
    tabs.appendChild(btn);
  });
  wrap.appendChild(tabs);

  var listKey='list_'+curListTab;
  var items=data[listKey]||[];

  // add row
  var addRow=document.createElement('div');addRow.className='list-add-row';
  if(curListTab==='tasks'){
    addRow.innerHTML='<select id="list-pri" style="background:var(--s2);border:1px solid var(--b2);color:var(--tx);font-family:Heebo,sans-serif;font-size:12px;padding:11px 9px;border-radius:var(--rs);outline:none">'+
      '<option value="high">🔴 דחוף</option><option value="med">🟡 בינוני</option><option value="low">🟢 נמוך</option></select>';
  }
  addRow.innerHTML+='<input class="list-input" id="list-input" placeholder="'+(curListTab==='shopping'?'מה לקנות?':'משימה חשובה...')+'" onkeydown="if(event.key===\'Enter\')addListItem()"/>'+
    '<button class="list-add-btn" onclick="addListItem()">+</button>';
  wrap.appendChild(addRow);

  // items
  var notDone=items.filter(function(i){return !i.done;});
  var done=items.filter(function(i){return i.done;});
  var allSorted=notDone.concat(done);

  if(!allSorted.length){var empty=document.createElement('div');empty.innerHTML='<div class="empty">'+(curListTab==='shopping'?'הרשימה ריקה — הוסף פריטים לקנות':'אין משימות חשובות')+'</div>';wrap.appendChild(empty);}

  allSorted.forEach(function(item){
    var el=document.createElement('div');el.className='card list-item'+(item.done?' done-item':'');
    var priHtml='';
    if(curListTab==='tasks'&&item.priority){
      var priCls={high:'pri-high',med:'pri-med',low:'pri-low'}[item.priority]||'';
      var priLbl={high:'דחוף',med:'בינוני',low:'נמוך'}[item.priority]||'';
      priHtml='<span class="list-priority '+priCls+'">'+priLbl+'</span>';
    }
    el.innerHTML='<div class="list-chk" onclick="toggleListItem(\''+item.id+'\')">'+(item.done?'✓':'')+'</div>'+
      '<div class="list-item-text">'+priHtml+item.text+'</div>'+
      '<div class="list-item-del" onclick="deleteListItem(\''+item.id+'\')">×</div>';
    wrap.appendChild(el);
  });

  // clear done button
  if(done.length>0){
    var clearBtn=document.createElement('button');
    clearBtn.style.cssText='width:100%;padding:10px;margin-top:8px;background:transparent;border:1px solid var(--b2);border-radius:var(--rs);color:var(--mu2);font-family:Heebo,sans-serif;font-size:12px;font-weight:600;cursor:pointer';
    clearBtn.textContent='נקה '+done.length+' פריטים שהושלמו';
    clearBtn.onclick=function(){data['list_'+curListTab]=(data['list_'+curListTab]||[]).filter(function(i){return !i.done;});save();renderLists();};
    wrap.appendChild(clearBtn);
  }
}
function addListItem(){
  var inp=document.getElementById('list-input');if(!inp||!inp.value.trim())return;
  var listKey='list_'+curListTab;if(!data[listKey])data[listKey]=[];
  var item={id:Date.now()+'',text:inp.value.trim(),done:false};
  if(curListTab==='tasks'){var priEl=document.getElementById('list-pri');item.priority=priEl?priEl.value:'med';}
  data[listKey].push(item);save();inp.value='';renderLists();
}
function toggleListItem(id){var listKey='list_'+curListTab;var item=(data[listKey]||[]).find(function(i){return i.id===id;});if(item)item.done=!item.done;save();renderLists();}
function deleteListItem(id){var listKey='list_'+curListTab;data[listKey]=(data[listKey]||[]).filter(function(i){return i.id!==id;});save();renderLists();}

// MAIN RENDER
function render(){
  var s=streak();
  var sb=document.getElementById('streak-badge');if(sb){sb.style.display=s>0?'flex':'none';document.getElementById('streak-num').textContent=s;}
  renderWeekNav();renderDays();renderScore();renderTasks();renderWkBars();renderWater();renderMood();
  if(curSub==='timeline')renderTimeline();
  if(curSub==='notes')renderNotes();
}

function renderWeekNav(){
  var sat=new Date(viewSun);sat.setDate(viewSun.getDate()+6);
  var fmt=function(d){return d.getDate()+' '+MONTHS[d.getMonth()];};
  document.getElementById('wk-label').textContent=fmt(viewSun)+' – '+fmt(sat);
  document.getElementById('next-btn').disabled=dkey(viewSun)===dkey(getSun(TODAY));
}
function renderDays(){
  var wrap=document.getElementById('day-scroll');wrap.innerHTML='';
  for(var i=0;i<7;i++){
    (function(i){
      var d=new Date(viewSun);d.setDate(viewSun.getDate()+i);
      var sc=score(d),has=hasAny(d),isT=dkey(d)===dkey(TODAY),isSel=dkey(d)===dkey(selDate);
      var btn=document.createElement('button');btn.className='daybtn'+(isSel?' on':'');
      btn.innerHTML=DAYS_S[d.getDay()]+'<span class="dp" style="color:'+(isSel?'inherit':has?col(sc):'var(--mu)')+'">'+( has?sc+'%':d.getDate())+'</span>';
      btn.onclick=function(){selDate=d;render();if(curSub==='timeline')renderTimeline();if(curSub==='notes')renderNotes();};
      wrap.appendChild(btn);
      if(isSel)setTimeout(function(){btn.scrollIntoView({inline:'center',behavior:'smooth'});},50);
    })(i);
  }
}
function renderScore(){
  var sc=score(selDate),c=col(sc);
  var scard=document.getElementById('scorecard-el');if(scard)scard.style.setProperty('--accent',c);
  document.getElementById('score-big').textContent=sc+'%';
  document.getElementById('score-big').style.color=c;
  document.getElementById('score-msg').textContent=msg(sc);
  document.getElementById('prog-fill').style.width=sc+'%';
  document.getElementById('prog-fill').style.background=c;
  document.getElementById('score-day').textContent=dkey(selDate)===dkey(TODAY)?'היום · '+dname(TODAY):selDate.getDate()+' '+MONTHS[selDate.getMonth()];
}
function renderTasks(){
  var dn=dname(selDate),sc=getSched(dn),tasks=sc.tasks||[],e=dd(selDate);
  var isFut=selDate>TODAY,list=document.getElementById('tasks-list');list.innerHTML='';
  // WAKE
  var ws=scoreWake(e.wake_actual,sc.wake),wc=col(ws);
  var wcard=document.createElement('div');wcard.className='card tsk tcard';
  wcard.innerHTML='<div class="tcardhead"><div style="font-size:20px">⏰</div><div class="tbody"><div class="tname">קימה</div><div class="tmeta">יעד: '+sc.wake+'</div></div><div style="font-size:14px;font-weight:700;color:'+wc+'">'+ws+'%</div></div>'+
    '<div class="tcardinputs"><div><span class="tlbl">קמתי בשעה</span><input type="time" class="tfield" value="'+(e.wake_actual||'')+'" '+(isFut?'disabled':'')+' onchange="saveTime(\'wake_actual\',this.value)"/></div>'+
    '<div><span class="tlbl">ציון</span><span class="tchip" style="background:'+wc+'22;color:'+wc+'">'+(ws>=80?'מצוין':ws>=50?'בסדר':'מאוחר')+' ('+ws+'%)</span></div></div>';
  list.appendChild(wcard);
  // TASKS
  tasks.forEach(function(t){
    var done=!!e[t.id];var card=document.createElement('div');card.className='card tsk'+(done?' done':'')+(isFut?' future':'');
    card.innerHTML='<div class="chk">'+(done?'✓':'')+'</div><div class="tbody"><div class="tname">'+t.name+'</div>'+(t.meta?'<div class="tmeta">'+t.meta+'</div>':'')+
      '</div><div class="tw">'+t.w+'%</div>';
    if(!isFut)card.onclick=(function(t){return function(){e[t.id]=!e[t.id];save();render();};})(t);
    list.appendChild(card);
  });
  // WORK
  (sc.work||[]).forEach(function(w){
    var wc2=document.createElement('div');wc2.className='card tsk done';wc2.style.cursor='default';
    wc2.innerHTML='<div class="chk" style="background:var(--bl);border-color:var(--bl);color:#000">✓</div>'+
      '<div class="tbody"><div class="tname">'+(w.type==='train'?'🏋️':'🏊')+' '+w.name+'</div><div class="tmeta">'+w.start+' – '+w.end+'</div></div>'+
      '<div class="tw" style="color:var(--bl);font-size:10px">עבודה</div>';
    list.appendChild(wc2);
  });

function getEvents(){
  if(!data.wg_events||!data.wg_events.length){data.wg_events=getDefaultEvents();save();}
  return data.wg_events;
}
function saveEvents(evs){data.wg_events=evs;save();}
function t2min(t){if(!t)return 9999;var p=t.split(':');var h=parseInt(p[0]);if(h<5)h+=24;return h*60+parseInt(p[1]||0);}

function renderSched(){
  var wrap=document.getElementById('week-table-wrap');if(!wrap)return;
  var events=getEvents();
  var todayName=DAYS[TODAY.getDay()];
  var hours=[];for(var h=5;h<24;h++)hours.push(h);hours.push(0);hours.push(1);hours.push(2);
  var map={};
  DAYS.forEach(function(d){map[d]={};hours.forEach(function(h){map[d][h]=[];});});
  events.forEach(function(ev){
    if(!ev.start)return;
    var hh=parseInt(ev.start.split(':')[0]);
    (ev.days||[]).forEach(function(day){if(map[day]&&map[day][hh]!==undefined)map[day][hh].push(ev);});
  });
  var table=document.createElement('table');table.className='wtbl';
  var thead=document.createElement('thead');var tr=document.createElement('tr');
  var th0=document.createElement('th');th0.textContent='';tr.appendChild(th0);
  DAYS.forEach(function(day){var th=document.createElement('th');th.textContent=day;if(day===todayName)th.className='wt-today';tr.appendChild(th);});
  thead.appendChild(tr);table.appendChild(thead);
  var tbody=document.createElement('tbody');
  hours.forEach(function(h){
    var tr2=document.createElement('tr');
    var tdH=document.createElement('td');tdH.textContent=('0'+h).slice(-2)+':00';tr2.appendChild(tdH);
    DAYS.forEach(function(day){
      var td=document.createElement('td');
      (map[day][h]||[]).sort(function(a,b){return t2min(a.start)-t2min(b.start);}).forEach(function(ev){
        var div=document.createElement('div');div.className='wev wev-'+ev.type;
        div.innerHTML='<div class="wev-name">'+ev.name+'</div>'+
          '<div class="wev-time">'+ev.start+(ev.end?' – '+ev.end:'')+'</div>'+
          (ev.note?'<div class="wev-note">'+ev.note+'</div>':'')+
          (ev.price?'<div class="wev-note" style="color:#86efac">₪'+ev.price+'</div>':'')+
          (ev.repeat==='once'?'<div style="font-size:8px;opacity:0.5;margin-top:1px">חד פעמי</div>':'');
        div.onclick=(function(ev){return function(e){e.stopPropagation();openEditEvent(ev);};})(ev);
        td.appendChild(div);
      });
      var ab=document.createElement('button');ab.className='wev-add';ab.textContent='+';
      (function(d,h){ab.onclick=function(e){e.stopPropagation();openAddEvent(d,h);};})(day,h);
      td.appendChild(ab);tr2.appendChild(td);
    });
    tbody.appendChild(tr2);
  });
  table.appendChild(tbody);
  var wdiv=document.createElement('div');wdiv.className='wtbl-wrap';wdiv.appendChild(table);
  wrap.innerHTML='';wrap.appendChild(wdiv);
  setTimeout(function(){
    var curH=new Date().getHours();var rows=table.querySelectorAll('tr');
    var idx=curH>=5?curH-5:curH+19;if(rows[idx+1])rows[idx+1].scrollIntoView({behavior:'smooth',block:'center'});
  },100);
}

function openAddEvent(day,h){
  evEditId=null;evSelType='work';evSelDays=day?[day]:[];evSelRepeat='weekly';
  document.getElementById('ev-modal-title').textContent='הוסף אירוע';
  document.getElementById('ev-del-btn').style.display='none';
  document.getElementById('ev-name').value='';
  document.getElementById('ev-note').value='';
  document.getElementById('ev-price').value='';
  document.getElementById('ev-start').value=h!=null?('0'+h).slice(-2)+':00':'';
  document.getElementById('ev-end').value='';
  renderEvModal();showEvModal();
}
function openEditEvent(ev){
  evEditId=ev.id;evSelType=ev.type||'work';evSelDays=(ev.days||[]).slice();evSelRepeat=ev.repeat||'weekly';
  document.getElementById('ev-modal-title').textContent='ערוך אירוע';
  document.getElementById('ev-del-btn').style.display='block';
  document.getElementById('ev-name').value=ev.name||'';
  document.getElementById('ev-note').value=ev.note||'';
  document.getElementById('ev-price').value=ev.price||'';
  document.getElementById('ev-start').value=ev.start||'';
  document.getElementById('ev-end').value=ev.end||'';
  renderEvModal();showEvModal();
}
function renderEvModal(){
  var tb=document.getElementById('ev-type-btns');tb.innerHTML='';
  EV_TYPES.forEach(function(t){
    var b=document.createElement('button');b.className='ev-pill'+(evSelType===t.id?' sel':'');b.textContent=t.label;
    b.onclick=(function(t){return function(){evSelType=t.id;renderEvModal();};})(t);tb.appendChild(b);
  });
  var db=document.getElementById('ev-days-btns');db.innerHTML='';
  DAYS.forEach(function(day){
    var b=document.createElement('button');b.className='ev-pill'+(evSelDays.indexOf(day)>=0?' sel':'');b.textContent=day;
    b.onclick=(function(day){return function(){var i=evSelDays.indexOf(day);if(i>=0)evSelDays.splice(i,1);else evSelDays.push(day);renderEvModal();};})(day);
    db.appendChild(b);
  });
  var rb=document.getElementById('ev-repeat-btns');rb.innerHTML='';
  [{id:'weekly',l:'קבוע כל שבוע'},{id:'once',l:'חד פעמי'}].forEach(function(r){
    var b=document.createElement('button');b.className='ev-pill'+(evSelRepeat===r.id?' sel':'');b.textContent=r.l;
    b.onclick=(function(r){return function(){evSelRepeat=r.id;renderEvModal();};})(r);rb.appendChild(b);
  });
}
function showEvModal(){document.getElementById('ev-overlay').style.display='block';document.getElementById('ev-modal').style.display='block';}
function closeEventModal(){document.getElementById('ev-overlay').style.display='none';document.getElementById('ev-modal').style.display='none';}
function saveEvent(){
  var name=document.getElementById('ev-name').value.trim();if(!name)return;
  if(!evSelDays.length){alert('בחר לפחות יום אחד');return;}
  var events=getEvents();
  var obj={id:evEditId||('ev_'+Date.now()),name:name,
    start:document.getElementById('ev-start').value,end:document.getElementById('ev-end').value,
    type:evSelType,days:evSelDays.slice(),note:document.getElementById('ev-note').value.trim(),
    price:parseFloat(document.getElementById('ev-price').value)||0,repeat:evSelRepeat};
  if(evEditId){for(var i=0;i<events.length;i++){if(events[i].id===evEditId){events[i]=obj;break;}}
  } else {events.push(obj);}
  saveEvents(events);closeEventModal();renderSched();
}
function deleteEvent(){
  if(!evEditId||!confirm('למחוק?'))return;
  saveEvents(getEvents().filter(function(e){return e.id!==evEditId;}));
  closeEventModal();renderSched();
}

      '<input id="cl-entrydate" type="date" value="'+(ec.entryDate||'')+'" style="width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:10px 12px;color:var(--tx);font-family:Heebo,sans-serif;font-size:13px;outline:none;margin-bottom:12px"/>'+
      '<button onclick="saveClientForm()" style="width:100%;padding:12px;background:var(--gr);color:#000;border:none;border-radius:var(--rs);font-family:Heebo,sans-serif;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:8px">שמור</button>'+
      '<button onclick="cancelClientForm()" style="width:100%;padding:10px;background:transparent;border:1px solid var(--b2);color:var(--mu2);border-radius:var(--rs);font-family:Heebo,sans-serif;font-size:12px;font-weight:600;cursor:pointer">ביטול</button>';
    wrap.appendChild(form);
  }
  if(!clients.length&&!showClientForm){wrap.innerHTML+='<div class="empty" style="padding:40px 0">אין לקוחות עדיין<br><span style="font-size:11px;color:var(--mu)">לחץ + חדש כדי להתחיל</span></div>';return;}
  clients.forEach(function(cl,idx){
    var payCls={paid:'pay-paid',pending:'pay-pending',overdue:'pay-overdue'}[cl.payStatus||'pending'];
    var payLbl={paid:'שילם',pending:'ממתין',overdue:'באיחור'}[cl.payStatus||'pending'];
    var card=document.createElement('div');card.className='card cl-card';
    card.innerHTML='<button onclick="editClient('+idx+')" style="position:absolute;top:14px;left:14px;background:transparent;border:1px solid var(--b2);color:var(--mu2);padding:5px 11px;border-radius:var(--rx);font-size:11px;font-weight:600;cursor:pointer;font-family:Heebo,sans-serif">✏️ ערוך</button>'+
      '<div class="cl-name">'+cl.name+'</div>'+
      '<span class="cl-badge '+(cl.type==='online'?'cl-online':'cl-frontal')+'">'+(cl.type==='online'?'אונליין 📱':'פרונטלי 🏋️')+'</span>'+
      '<div class="cl-row"><span class="cl-lbl">מחיר חודשי</span><span class="cl-val" style="color:var(--gr)">₪'+(cl.price||'—')+'</span></div>'+
      '<div class="cl-row"><span class="cl-lbl">תאריך תשלום</span><span class="cl-val">'+(cl.payDay?cl.payDay+' לחודש':'—')+'</span></div>'+
      '<div class="cl-row"><span class="cl-lbl">סטטוס</span><span class="'+payCls+'">'+payLbl+'</span></div>'+
      (cl.reminder?'<div class="cl-row"><span class="cl-lbl">תזכורת</span><span class="cl-val" style="color:var(--am);font-size:11px">⚠️ '+cl.reminder+'</span></div>':'')+
      (cl.phone?'<div class="cl-row"><span class="cl-lbl">טלפון</span><span class="cl-val" style="color:var(--bl)">'+cl.phone+'</span></div>':'')+
      (cl.entryDate?'<div class="cl-row"><span class="cl-lbl">תאריך כניסה</span><span class="cl-val">'+cl.entryDate+'</span></div>':'')+
      '<div style="margin-top:12px"><div style="font-size:10px;font-weight:700;color:var(--mu2);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px">אימונים חד-פעמיים</div>'+
      '<div id="sess-'+idx+'"></div>'+
      '<div style="display:flex;gap:7px;margin-top:8px">'+
        '<input id="sess-d-'+idx+'" type="date" style="flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:8px 10px;color:var(--tx);font-family:Heebo,sans-serif;font-size:12px;outline:none"/>'+
        '<input id="sess-a-'+idx+'" type="number" placeholder="₪" style="width:65px;background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:8px;color:var(--tx);font-family:Heebo,sans-serif;font-size:12px;outline:none;text-align:center"/>'+
        '<button onclick="addSession('+idx+')" style="background:var(--tl2);border:1px solid rgba(20,184,166,0.3);color:var(--tl);padding:8px 12px;border-radius:var(--rs);font-size:12px;font-weight:700;cursor:pointer;font-family:Heebo,sans-serif">+</button>'+
      '</div></div>'+
      '<div style="margin-top:12px;margin-bottom:8px">'+
        '<button onclick="addClientIncomeToMonth('+idx+')" style="width:100%;padding:10px;border-radius:var(--rs);border:1px solid rgba(34,197,94,0.35);background:rgba(34,197,94,0.08);color:var(--gr);font-family:Heebo,sans-serif;font-size:12px;font-weight:700;cursor:pointer">+ הוסף תשלום חודשי להכנסות (₪'+(cl.price||0)+')</button>'+
      '</div>'+
      '<div style="display:flex;gap:7px">'+
        '<button onclick="togglePay('+idx+')" style="flex:1;padding:8px;border-radius:var(--rs);border:1px solid var(--b2);background:transparent;color:var(--mu2);font-family:Heebo,sans-serif;font-size:11px;font-weight:600;cursor:pointer">שנה סטטוס</button>'+
        '<button onclick="deleteClient('+idx+')" style="padding:8px 12px;border-radius:var(--rs);border:1px solid rgba(239,68,68,0.3);background:transparent;color:var(--rd);font-family:Heebo,sans-serif;font-size:11px;font-weight:600;cursor:pointer">מחק</button>'+
      '</div>';
    wrap.appendChild(card);
    renderSessions(idx);
  });
}
function renderSessions(idx){
  var wrap=document.getElementById('sess-'+idx);if(!wrap)return;
  var cl=getClients()[idx];var sessions=cl&&cl.sessions||[];
  wrap.innerHTML='';
  if(!sessions.length){wrap.innerHTML='<div style="font-size:11px;color:var(--mu)">אין אימונים רשומים</div>';return;}
  sessions.slice().reverse().forEach(function(s,ri){
    var realIdx=sessions.length-1-ri;
    var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b1);font-size:12px';
    row.innerHTML='<div><div style="font-weight:600">'+s.date+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+(s.amount?'<span style="font-weight:700;color:var(--tl)">₪'+s.amount+'</span>':'')+
      '<span style="color:var(--mu);font-size:16px;cursor:pointer" onclick="deleteSession('+idx+','+realIdx+')">×</span></div>';
    wrap.appendChild(row);
  });
}
function addSession(idx){
  var d=document.getElementById('sess-d-'+idx);var a=document.getElementById('sess-a-'+idx);
  if(!d||!d.value)return;
  var clients=getClients();if(!clients[idx].sessions)clients[idx].sessions=[];
  clients[idx].sessions.push({date:d.value,amount:parseFloat(a.value)||0});
  saveClients(clients);d.value='';if(a)a.value='';renderSessions(idx);
}
function deleteSession(ci,si){var clients=getClients();clients[ci].sessions=(clients[ci].sessions||[]).filter(function(_,i){return i!==si;});saveClients(clients);renderSessions(ci);}
function togglePay(idx){var clients=getClients();var order=['pending','paid','overdue'];var cur=clients[idx].payStatus||'pending';clients[idx].payStatus=order[(order.indexOf(cur)+1)%order.length];saveClients(clients);renderClients();}
function editClient(idx){editClientIdx=idx;showClientForm=true;renderClients();}
function deleteClient(idx){if(!confirm('למחוק?'))return;var c=getClients();c.splice(idx,1);saveClients(c);renderClients();}
function toggleClientForm(){showClientForm=!showClientForm;editClientIdx=null;renderClients();}
function cancelClientForm(){showClientForm=false;editClientIdx=null;renderClients();}
function addClientIncomeToMonth(idx){
  var cl=getClients()[idx];
  if(!cl||!cl.price)return;
  var fd=getMonthFinanceData(finYear,finMonth);
  if(!fd.extras)fd.extras=[];
  var today=dkey(TODAY);
  var desc='תשלום חודשי — '+cl.name;
  // Check if already added this month
  var already=(fd.extras||[]).find(function(e){return e.clientIdx===idx&&e.month===finYear+'-'+finMonth;});
  if(already){alert('כבר הוספת את התשלום של '+cl.name+' לחודש הזה');return;}
  fd.extras.push({id:Date.now()+'',type:'income',desc:desc,amount:cl.price,date:today,clientIdx:idx,month:finYear+'-'+finMonth});
  var k=getFinanceKey(finYear,finMonth);data[k]=fd;
  save();
  // Mark as paid
  var clients=getClients();clients[idx].payStatus='paid';saveClients(clients);
  alert('✅ נוסף ₪'+cl.price+' להכנסות '+['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'][finMonth]);
  renderClients();renderDash();
}
function saveClientForm(){
  var name=document.getElementById('cl-name').value.trim();if(!name)return;
  var clients=getClients();
  var obj={name:name,type:document.getElementById('cl-type').value,price:parseFloat(document.getElementById('cl-price').value)||0,
    payDay:parseInt(document.getElementById('cl-payday').value)||0,payStatus:document.getElementById('cl-paystatus').value,
    reminder:document.getElementById('cl-reminder').value.trim(),phone:document.getElementById('cl-phone').value.trim()};
  if(editClientIdx!==null){Object.assign(clients[editClientIdx],obj);}else{obj.sessions=[];clients.push(obj);}
  saveClients(clients);showClientForm=false;editClientIdx=null;renderClients();
}
function adjGymSales(delta){
  var fd=getMonthFinanceData(finYear,finMonth);
  var cur=fd.gymSales||0;
  var nv=Math.max(0,cur+delta);
  fd.gymSales=nv;
  data[getFinanceKey(finYear,finMonth)]=fd;
  save();
  var inp=document.getElementById('gym-sales-input');
  if(inp)inp.value=nv;
  renderFinance();renderDash();
}
function removeDay(key){
  var fd=getMonthFinanceData(finYear,finMonth);
  if(!fd.removedDays)fd.removedDays={};
  fd.removedDays[key]=true;
  data[getFinanceKey(finYear,finMonth)]=fd;
  save();renderFinance();renderDash();
}
function restoreDay(key){
  var fd=getMonthFinanceData(finYear,finMonth);
  if(fd.removedDays)delete fd.removedDays[key];
  if(fd.removedDates)delete fd.removedDates[key];
  data[getFinanceKey(finYear,finMonth)]=fd;
  save();renderFinance();renderDash();
}
function pickRemoveDate(key,dayName){
  var dates=[];
  var d=new Date(finYear,finMonth,1);
  var dayIdx=DAYS.indexOf(dayName);
  while(d.getMonth()===finMonth){
    if(d.getDay()===dayIdx){
      dates.push({date:d.getDate(),str:d.getDate()+'.'+( d.getMonth()+1)});
    }
    d.setDate(d.getDate()+1);
  }
  // Build inline date picker
  var existing=document.getElementById('date-picker-'+key);
  if(existing){existing.remove();return;}
  var picker=document.createElement('div');
  picker.id='date-picker-'+key;
  picker.style.cssText='background:var(--s3);border-radius:var(--rs);padding:10px;margin-top:8px';
  picker.innerHTML='<div style="font-size:11px;color:var(--mu2);margin-bottom:8px;font-weight:600">בחר יום שלא עבדת:</div>';
  var fd=getMonthFinanceData(finYear,finMonth);
  var removedDates=(fd.removedDates&&fd.removedDates[key])||[];
  dates.forEach(function(dt){
    var isRemoved=removedDates.indexOf(dt.str)>=0;
    var btn=document.createElement('button');
    btn.style.cssText='padding:6px 12px;margin:3px;border-radius:6px;border:1px solid '+(isRemoved?'rgba(239,68,68,0.5)':'var(--b2)')+';background:'+(isRemoved?'var(--rd2)':'var(--s2)')+';color:'+(isRemoved?'var(--rd)':'var(--tx)')+';font-family:Heebo,sans-serif;font-size:12px;font-weight:600;cursor:pointer';
    btn.textContent=(isRemoved?'✓ ':'')+dt.str;
    btn.onclick=(function(dt,isRemoved){return function(){
      var fd2=getMonthFinanceData(finYear,finMonth);
      if(!fd2.removedDates)fd2.removedDates={};
      if(!fd2.removedDates[key])fd2.removedDates[key]=[];
      var idx=fd2.removedDates[key].indexOf(dt.str);
      if(idx>=0)fd2.removedDates[key].splice(idx,1);
      else fd2.removedDates[key].push(dt.str);
      data[getFinanceKey(finYear,finMonth)]=fd2;
      save();renderFinance();renderDash();
    };})(dt,isRemoved);
    picker.appendChild(btn);
  });
  var closeBtn=document.createElement('button');
  closeBtn.style.cssText='width:100%;margin-top:8px;padding:6px;border-radius:6px;border:1px solid var(--b2);background:transparent;color:var(--mu2);font-family:Heebo,sans-serif;font-size:11px;cursor:pointer';
  closeBtn.textContent='סגור';
  closeBtn.onclick=function(){picker.remove();};
  picker.appendChild(closeBtn);
  // Insert after the row
  var row=document.getElementById('row-'+key);
  if(row)row.after(picker);
  else{var editCard=document.getElementById('edit-card-fin');if(editCard)editCard.appendChild(picker);}
}

// START
function _init(){
  try{render();}catch(e){console.error('render',e);}
  try{renderDash();}catch(e){console.error('renderDash',e);}
  try{initAuth();}catch(e){console.error('initAuth',e);}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',_init);}else{_init();}
</script>
</body>
</html>
